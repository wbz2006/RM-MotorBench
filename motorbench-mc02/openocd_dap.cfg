# MC02: STM32H723VGT6, DAPLink / CMSIS-DAP v1 or v2, SWD.
source [find interface/cmsis-dap.cfg]
transport select swd

set CHIPNAME stm32h723
set DUAL_CORE 0
set DUAL_BANK 0
source [find target/stm32h7x.cfg]

# Override the target script's default speed. NRST is optional: use SYSRESETREQ.
adapter speed 1000
reset_config none
